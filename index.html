<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8" />
    <title>DİDEM'İN DOĞUM GÜNÜNE SON!</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            font-family: "Segoe UI", sans-serif;
            text-align: center;
        }

        .container {
            background: rgba(255,255,255,0.8);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 10px 25px rgba(0,0,0,0.2);
            max-width: 420px;
            width: 90%;
            backdrop-filter: blur(10px);
        }

        h1 {
            font-size: 26px;
            margin-bottom: 20px;
            color: #d63384;
        }

        #countdown {
            font-size: 22px;
            font-weight: bold;
            color: #c2185b;
            margin-bottom: 20px;
        }

        #message {
            font-size: 26px;
            font-weight: bold;
            margin-top: 15px;
            color: #d63384;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>28.11.25 DİDEM ARTIK 18</h1>
        <div id="countdown"></div>
        <div id="message"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <script>
        let countdownInterval;

        function launchConfetti() {
            let duration = 5000;
            let end = Date.now() + duration;

            (function frame() {
                confetti({ particleCount: 7, angle: 60, spread: 55, origin: { x: 0 } });
                confetti({ particleCount: 7, angle: 120, spread: 55, origin: { x: 1 } });

                if (Date.now() < end) requestAnimationFrame(frame);
            })();
        }

        function updateCountdown() {
            const now = new Date();
            const birthday = new Date("2025-11-28T00:00:00");
            let diff = birthday - now;

            if (diff <= 0) {
                clearInterval(countdownInterval);
                document.getElementById("countdown").textContent = "";
                document.getElementById("message").textContent = "🎉 İYİ Kİ DOĞDUN, İYİ Kİ VARSIN DİDEM 🎉";
                launchConfetti();
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("countdown").textContent =
                `${days} gün ${hours} saat ${minutes} dk ${seconds} sn kaldı`;
        }

        countdownInterval = setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>

</body>
</html>
