<!DOCTYPE html>
<html>
<head>
    <title>Didem’in Doğum Günü Geri Sayımı</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background: #fff;
        }
        #countdown {
            font-size: 2em;
            color: #e91e63;
        }
        #message {
            font-size: 2em;
            color: #ff5722;
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Didem’in Doğum Gününe Geri Sayım</h1>
    <div id="countdown"></div>
    <div id="message"></div>

    <!-- Confetti kütüphanesi -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <script>
        let countdownInterval;

        function launchConfetti() {
            // Confetti’yi kısa aralıklarla sürekli patlat
            let duration = 5000; // 5 saniye
            let end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 }
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 }
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        function updateCountdown() {
            const now = new Date();
            const birthday = new Date("2025-11-28T00:00:00"); // Doğum günü tarihi
            let diff = birthday - now;

            if(diff <= 0){
                clearInterval(countdownInterval);
                document.getElementById("countdown").textContent = "";
                document.getElementById("message").textContent = "🎉 İYİ Kİ DOĞDUN, İYİ Kİ VARSIN DİDEM 🎉";
                launchConfetti();
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById("countdown").textContent =
                days + " gün " + hours + " saat " + minutes + " dk " + seconds + " sn kaldı";
        }

        countdownInterval = setInterval(updateCountdown, 1000);
        updateCountdown();
    </script>
</body>
</html>
